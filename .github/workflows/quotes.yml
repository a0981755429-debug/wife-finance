name: 更新收盤價

# 每個交易日傍晚 6 點和晚上 9 點（台灣時間）抓收盤價（證交所的資料比較晚更新）寫到 app/quotes.json，網頁的現價會自動換成新的。
on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓收盤價
        run: node tools/quotes.mjs
      - name: 有變動才存回
        run: |
          if [ -z "$(git status --porcelain app/quotes.json)" ]; then echo "沒有變動"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add app/quotes.json
          git commit -m "更新收盤價 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done; exit 1
