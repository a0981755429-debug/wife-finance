name: 檢查程式碼

on:
  push:
    branches: [main]
    paths-ignore: [app/vault.json, app/quotes.json]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 語法檢查
        run: |
          node --check app/app.js
          node --check app/smoney.js
          node --check app/audit.js
          node --check app/funds.js
          node --check app/vault.js
          node --check app/sync.js
          node --check tools/quotes-parse.cjs
      - name: 測試
        run: node --test tests/*.test.js
